[gcode_macro CLEAN_NOZZLE]
variable_start_x: 179
variable_start_y: 307
variable_start_z: 0
variable_wipe_dist: 30
variable_wipe_qty: 10
variable_wipe_spd: 350
variable_raise_distance: 0
gcode:
#  STATUS_CLEANING
 {% if "xy" not in printer.toolhead.homed_axes %}
   G28 X Y
 {% endif %}
 G90                                            ; absolute positioning
 G1 x179 Y190 F18000           # move left to start wipe location
 G1 x179 Y307 F18000           # move left to start wipe location
 ## Move nozzle to start position
 G1 X{start_x} Y{start_y} F16000
#  G1 Z{start_z} F1500
 ## Wipe nozzle
 {% for wipes in range(1, (wipe_qty + 1)) %}
   G1 X{start_x + wipe_dist} F{wipe_spd * 60}
   G1 X{start_x} F{wipe_spd * 60}
 {% endfor %}
 G1 x179 Y290 F18000
 ## Raise nozzle
#  G1 Z{raise_distance}
#  STATUS_READY

[gcode_macro PURGE_NOZZLE]
variable_start_x: 179
variable_start_y: 307
variable_start_z: 0
variable_wipe_dist: 30
variable_wipe_qty: 10
variable_wipe_spd: 350
variable_raise_distance: 0
gcode:
#  STATUS_CLEANING
  {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(245)|float %}
  M104 S{EXTRUDER_TEMP}                               #start heating nozzle dont wait
 {% if "xy" not in printer.toolhead.homed_axes %}
   G28 X Y
 {% endif %}
 G90                                            # absolute positioning
 G1 X209 Y290 F18000 # move to start position for poopies
 G1 X229 Y309 F18000 # poop location
 M109 S{EXTRUDER_TEMP}                          # wait for nozzle temperature before next step
 G1 X229 Y309 F18000 # poop location
 M83
 G1 E90 F900
 G90                                            # absolute positioning
 G1 x229 Y290 F18000          # move forward from poop location
 G1 x179 Y307 F18000           # move left to start wipe location

 ## Move nozzle to start position
 G1 X{start_x} Y{start_y} F6000
#  G1 Z{start_z} F1500
 ## Wipe nozzle
 {% for wipes in range(1, (wipe_qty + 1)) %}
   G1 X{start_x + wipe_dist} F{wipe_spd * 60}
   G1 X{start_x} F{wipe_spd * 60}
 {% endfor %}
 G1 x179 Y290 F18000           # move away from poop brushy