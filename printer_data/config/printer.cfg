#####################################################################
# 	Fan Control
#####################################################################

[duplicate_pin_override]
pins: EBBCan: PA1, PG14, PF6, PB1, PF8, PF9, PA4, PB0, rpi:gpio26, PA6, PA2

[fan]                       # cpap part cooling fan
pin: PC15 # endstop 5
cycle_time: 0.00004
kick_start_time: 0.5

[heater_fan hotend_fan]     # nozzle fan
pin: EBBCan: PA0
max_power: 1.0
kick_start_time: 0.5
heater: extruder
shutdown_speed: 1
heater_temp: 60.0

[temperature_fan MCU]
pin: PF7
cycle_time: 0.0100
hardware_pwm: false 
max_power: 1
max_speed: 1.0
min_speed: 0
shutdown_speed: 0
sensor_type: temperature_host
min_temp: -10
max_temp: 90
control: pid
pid_Kp: 4.0
pid_Ki: 1
pid_Kd: 0.2
pid_deriv_time: 2.0
target_temp: 75.0
max_speed: 1.0
min_speed: 0

[output_pin Exhaust]
pin: PF9
pwm: True
cycle_time: 0.0100
hardware_pwm: false
value: 0.00
scale: 255
shutdown_value: 0.0

[temperature_fan Exhaust]
pin: PF9
cycle_time: 0.0100
hardware_pwm: false 
max_power: 1
max_speed: 1.0
min_speed: 0
shutdown_speed: 0
sensor_type: MAX31865
sensor_pin: PG14
spi_speed: 4000000
spi_software_sclk_pin: PG8
spi_software_mosi_pin: PG6
spi_software_miso_pin: PG7
min_temp: -270
max_temp: 270
control: pid
gcode_id: C
pid_Kp: 4.0
pid_Ki: 1
pid_Kd: 0.2
pid_deriv_time: 2.0
target_temp: 75.0
max_speed: 1.0
min_speed: 0.0

[output_pin Nevermore]
pin: PF6
pwm: True
cycle_time: 0.0100
hardware_pwm: false
value: 0.00
scale: 255
shutdown_value: 0.0

[heater_fan Nevermore]     # nevermore auto activate
pin: PF6
max_power: 1.0
kick_start_time: 0.5
heater: heater_bed
heater_temp: 90.0

[temperature_fan Bedfans]     # bedfans temp control
pin: PF8
cycle_time: 0.01
hardware_pwm: false
reverse: true 
kick_start_time: 0.5
max_power: 1
max_speed: 1.0
min_speed: 0
shutdown_speed: 0
sensor_type: MAX31865
sensor_pin: PG14
spi_speed: 4000000
spi_software_sclk_pin: PG8
spi_software_mosi_pin: PG6
spi_software_miso_pin: PG7
min_temp: 0
max_temp: 120
control: pid
pid_Kp: 4.0
pid_Ki: 1
pid_Kd: 0.2
pid_deriv_time: 2.0
target_temp: 0.0
max_speed: 1.0
min_speed: 0.0

