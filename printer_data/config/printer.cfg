
# shimbo's voron trident cfg smilew
# V1.4 ACTH Test

#####################################################################
#   includes and shit
#####################################################################

[include mainsail.cfg]
[include timelapse.cfg]
[include ./macro-shit/*.cfg]
[include chopper_tune.cfg]
[include gcode_macro.cfg]

#####################################################################
# 	mcu setup
#####################################################################

[mcu]
canbus_uuid: b32cfffff342

[mcu EBBCan]
canbus_uuid: d7ade03dbecf

[mcu rpi]
serial: /tmp/klipper_host_mcu

[mcu cartographer]
canbus_uuid: b72de4720e0b

[mcu flyadxl]
serial: /dev/serial/by-id/usb-Klipper_rp2040_E6647C74034B0C37-if00
is_non_critical: true

[cartographer]
mcu: cartographer
x_offset: 0                       # This is the offset of your probe from the nozzle tip, to the centre of the coil.
y_offset: 21                      # This is the offset of your probe from the nozzle tip, to the centre of the coil.
travel_speed: 500
verbose: yes                      # For extra output

#####################################################################
# 	printer definitions
#####################################################################

[printer]
kinematics: corexy
max_velocity: 1000
# max_y_accel: 60000
# max_x_accel: 100000
# scale_xy_accel: true
max_accel: 60000
minimum_cruise_ratio: 0.25
max_z_velocity: 30
max_z_accel: 800
square_corner_velocity: 15

[firmware_retraction]
retract_length: 0.6
retract_speed: 65 
unretract_speed: 60

[input_shaper]
##  A frequency (in Hz) of the input shaper for X or Y axis. 
shaper_type_x: smooth_mzv
shaper_type_y: smooth_mzv
smoother_freq_x: 93.2
smoother_freq_y: 64.0

[shaketune]
result_folder: ~/printer_data/config/ShakeTune_results
number_of_results_to_keep: 30
# keep_raw_csv: False
show_macros_in_webui: True
# timeout: 300

[gcode_arcs]
resolution: 0.2
[exclude_object]
[respond]

[pause_resume]
recover_velocity: 500

#####################################################################
# 	danger klipper      https://dangerklipper.io/Config_Reference.htm
#####################################################################

[force_move]
enable_force_move: True

[danger_options]
homing_start_delay: 0.001
endstop_sample_count: 1
#minimal_logging: False
log_shutdown_info: True
log_config_file_at_startup: False
log_statistics: False

# [stepper_x]
# high_precision_step_compress: true

# [stepper_y]
# high_precision_step_compress: true

# [input_shaper]
# enabled_extruders: extruder

[extruder]
#control: mpc
heater_power: 100 #65  
cooling_fan: fan
filament_diameter: 1.75
filament_density: 1.20
filament_heat_capacity: 1.8 


#####################################################################
# 	Safety Shit
#####################################################################

[verify_heater extruder]

[verify_heater heater_bed]
check_gain_time: 120
heating_gain: 1.0
hysteresis: 10
max_error: 60

[idle_timeout]
timeout: 6000

#####################################################################
# 	X/Y Stepper Settings
#####################################################################

## X Stepper on Motor1(B Motor)
[stepper_y]
step_pin: PE6
dir_pin: PE5
enable_pin: !PC14
microsteps: 64
rotation_distance: 40
full_steps_per_rotation:200
endstop_pin: ^!PF4
position_min: 0
position_endstop: 310
position_max: 310
homing_speed: 140  #Max 100
homing_retract_dist: 0
homing_positive_dir: true

[tmc5160 stepper_y]
cs_pin: PC13
# spi_bus: spi2
spi_software_sclk_pin: PG8
spi_software_mosi_pin: PG6
spi_software_miso_pin: PG7
diag0_pin: ^!PF3
sense_resistor: 0.075
interpolate: false
run_current: 2.2 #1.95
stealthchop_threshold: 0
driver_TBL: 1
driver_TOFF: 1
driver_HSTRT: 2
driver_HEND: 3
driver_TPFD: 5

## Y Stepper on Motor2 (A Motor)
[stepper_x]
step_pin: PE2
dir_pin: PE1
enable_pin: !PE4
microsteps: 64
rotation_distance: 40
full_steps_per_rotation:200  
endstop_pin: ^!EBBCan: PB6
position_min: 0
position_endstop: 290
position_max: 291
homing_speed: 140   
homing_retract_dist: 75
homing_positive_dir: true

[tmc5160 stepper_x]
cs_pin: PE3
# spi_bus: spi2
spi_software_sclk_pin: PG8
spi_software_mosi_pin: PG6
spi_software_miso_pin: PG7
diag0_pin: ^!PF3
sense_resistor: 0.075
interpolate: false
run_current: 2.2 #1.95
stealthchop_threshold: 0
driver_TBL: 1
driver_TOFF: 1
driver_HSTRT: 2
driver_HEND: 3
driver_TPFD: 5

#####################################################################
# 	Z Stepper Settings
#####################################################################

## Z0 Stepper - Front Left on MOTOR3_A
[stepper_z]
step_pin: PG9
dir_pin: !PD7
enable_pin: !PG11
rotation_distance: 4 
microsteps: 32
endstop_pin: probe:z_virtual_endstop # use cartographer as virtual endstop
position_max: 240
position_min: -5 # -2.5
homing_speed: 8.0 
second_homing_speed: 3
homing_retract_dist: 0

[tmc2209 stepper_z]
uart_pin: PG10
interpolate: true
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

[stepper_z1]
step_pin: PC7
dir_pin: !PC8
enable_pin: !PD2
rotation_distance: 4
microsteps: 32

[tmc2209 stepper_z1]
uart_pin: PC6
interpolate: true
run_current: 1
sense_resistor: 0.110
stealthchop_threshold: 0

[stepper_z2]
step_pin: PD4
dir_pin: !PD3
enable_pin: !PD6
rotation_distance: 4
microsteps: 32

[tmc2209 stepper_z2]
uart_pin: PD5
interpolate: true
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

#####################################################################
# 	Extruder
#####################################################################

[extruder]
step_pin: EBBCan: PD0
dir_pin: EBBCan: PD1
enable_pin: !EBBCan: PD2
heater_pin: EBBCan: PB13

rotation_distance:5.66523 # 10t   # 4.532184 #8t
microsteps: 16
full_steps_per_rotation: 200           #200 for 1.8 degree, 400 for 0.9 degree

nozzle_diameter: 0.400
filament_diameter: 1.75
pressure_advance: 0.02
pressure_advance_smooth_time: 0.003   # 0.042

sensor_type: PT1000
sensor_pin: EBBCan: PA3
pullup_resistor: 2200
min_temp: -270
max_temp: 500
max_power: 1.0
min_extrude_temp: 20
max_extrude_only_distance: 5000.0

[tmc2209 extruder]
uart_pin: EBBCan: PA15
interpolate: false
run_current: 0.7
sense_resistor: 0.110
stealthchop_threshold: 0

[filament_switch_sensor switch_sensor]
switch_pin: ^PF2
pause_on_runout: False
runout_gcode:
  PAUSE # [pause_resume] is required in printer.cfg
  M117 Filament switch runout
  {action_respond_info("Runout Switch~")}
  SET_DISPLAY_TEXT MSG="Runout Switch~"
insert_gcode:
  M117 Filament switch inserted

[filament_motion_sensor encoder_sensor]
switch_pin: ^!PF1
detection_length: 8.64
extruder: extruder
pause_on_runout: False
runout_gcode:
  PAUSE # [pause_resume] is required in printer.cfg
  M117 Filament encoder runout
    {action_respond_info("Runout encoder~")}
  SET_DISPLAY_TEXT MSG="Runout encoder~"
insert_gcode:
  M117 Filament encoder inserted

#####################################################################
# 	Bed Heater
#####################################################################

[heater_bed]
##	SSR Pin - HE1
heater_pin: PA1
sensor_type: Generic 3950
sensor_pin: PB1
max_power: 1
min_temp: -20
max_temp: 115       # 125c thermal fuse

#####################################################################
# 	Thermister Settings
#####################################################################

[temperature_sensor cartographer]
sensor_type: temperature_mcu
sensor_mcu: cartographer
min_temp: 5
max_temp: 150

[temperature_sensor Chamber]
sensor_type: MAX31865
sensor_pin: PG14
spi_speed: 4000000
spi_software_sclk_pin: PG8
spi_software_mosi_pin: PG6
spi_software_miso_pin: PG7
min_temp: -270
max_temp: 270

[temperature_sensor Pi_CM4]
sensor_type: temperature_host
min_temp: -270
max_temp: 270

[temperature_sensor Manta_M8P]
sensor_type: temperature_mcu
min_temp: -270
max_temp: 270

[temperature_sensor Ebb36]
sensor_type: temperature_mcu
sensor_mcu: EBBCan
min_temp: 0
max_temp: 100

