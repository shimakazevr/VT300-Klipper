[multi_pin _aux-fans]
pins: PA6, PA2

[fan_generic Aux-Fans]
pin: multi_pin:_aux-fans
kick_start_time: 0.2

#####################################################################
# 	LED Control
#####################################################################

[output_pin LED_Back]
pin: PA0
pwm:true
shutdown_value: 0
value:0
cycle_time: 0.0005 # 0.008333

[output_pin LED_Main]
pin: PA5
pwm:true
shutdown_value: 0
value:0.01
cycle_time: 0.0005

#####################################################################
# 	Homing and Gantry Adjustment Routines
#####################################################################

[safe_z_home]
home_xy_position:144,150
speed:500
z_hop:5

[z_tilt]
z_positions:
  -60, 10
  144, 348
  360, 10
points:
  30, 5
  150, 245
  270, 5
speed: 500
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.0075

[bed_mesh]
zero_reference_position: 145, 150
speed: 500
horizontal_move_z: 10
mesh_min: 25,25
mesh_pps: 1,1
mesh_max: 265, 275
# probe_count: 20,20
probe_count: 40,10
algorithm: bicubic
bicubic_tension: 0.2

[adxl345]                             # canbus accelerometer
cs_pin: EBBCan: PB12
spi_software_sclk_pin: EBBCan: PB10
spi_software_mosi_pin: EBBCan: PB11
spi_software_miso_pin: EBBCan: PB2
axes_map: x,z,y

[adxl345 flynozzle]
cs_pin: flyadxl:gpio9
spi_software_sclk_pin: flyadxl:gpio10
spi_software_mosi_pin: flyadxl:gpio11
spi_software_miso_pin: flyadxl:gpio12

[resonance_tester]
# accel_chip: adxl345     # toolhead
# accel_chip: lis2dw      # carto
accel_chip: adxl345 flynozzle # nozzle adxl
accel_per_hz: 125        # 75 default, 100 for more accurate testing
min_freq: 10
max_freq: 145

sweeping_period: 1.2
sweeping_accel: 400

probe_points:
   145,150,10

